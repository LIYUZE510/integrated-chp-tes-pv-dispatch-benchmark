defaults:
  storage:
    s_max_mwh: 800.0
    p_ch_max_mw: 200.0
    p_dis_max_mw: 200.0
    eta_ch: 0.95
    eta_dis: 0.95
    loss_per_hour: 0.001
    s_init_mwh: 200.0

  grid:
    grid_export_cap_mw: 60.0
    price_sell: 50.0
    price_buy: 70.0
    pv_scale: 1.0
    e_load_base_mw: 20.0
    e_load_alpha_per_heat: 0.0
    penalty_pv_curt: 0.1
    penalty_chp_curt: 0.0

  cost:
    cost_q: 15.0
    cost_boiler: 60.0
    cost_dump: 50.0
    penalty_under: 1000000.0
    cycle_cost: 0.01

  commitment:
    startup_cost: 5000.0
    shutdown_cost: 0.0
    min_up_hours: 3
    min_down_hours: 2
    on_init: 0

  solver:
    time_limit_s: 7200.0
    mip_rel_gap: 0.01
    tee: false

  qc:
    residual_tol: 1.0e-5
    bound_tol: 1.0e-5
    overlap_tol_mw: 1.0e-5
    fail_on_violation: false

output_csv: reports/exactness_anchor_fw.csv

experiments:
  - name: anchor24_uc
    scenarios: [week_2023_dec01_anchor24h_fw]
    run:
      method: uc
      tag: uc_anchor24h_fw
      uc_terminal_soc_mode: match_initial
    solver:
      time_limit_s: 7200.0
      mip_rel_gap: 0.01

  - name: anchor48_uc
    scenarios: [week_2023_dec01_anchor48h_fw]
    run:
      method: uc
      tag: uc_anchor48h_fw
      uc_terminal_soc_mode: match_initial
    solver:
      time_limit_s: 10800.0
      mip_rel_gap: 0.01

  - name: anchor48_mpc
    scenarios: [week_2023_dec01_anchor48h_fw]
    run:
      method: mpc
      tag: mpc_anchor48h_fw
      uc_terminal_soc_mode: match_initial
    solver:
      time_limit_s: 1800.0
      mip_rel_gap: 0.01
    rolling:
      enabled: true
      horizon_hours: 48
      step_hours: 24
      window_terminal_soc_mode: match_window_initial
      final_window_terminal_soc_mode: match_week_initial